name: Sync upstream and build image

# spxnso micro-fork automation:
# - Weekly (Monday 04:23 UTC): rebase the single patch commit onto
#   codefuturist/email-mcp main and push; the push triggers the build job.
# - On conflict the rebase fails and GitHub emails the owner — fix the
#   conflict manually (or ping your assistant) before the next run.
# - On push to main: build the Docker image and push it to GHCR.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-and-build
  cancel-in-progress: false

jobs:
  sync:
    name: Rebase patch onto upstream main
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto codefuturist/email-mcp
        run: |
          git config user.name "sync-bot"
          git config user.email "actions@github.com"
          git remote add upstream https://github.com/codefuturist/email-mcp.git
          git fetch upstream main
          git rebase upstream/main
          git push origin main --force-with-lease

  build:
    name: Build and push GHCR image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/email-mcp" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
